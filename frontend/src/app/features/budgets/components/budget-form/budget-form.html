<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field
    label="Categoria de despesa"
    controlId="budget-category"
    [required]="true"
    [error]="fieldError('categoryId')"
  >
    <select appSelect id="budget-category" formControlName="categoryId">
      <option value="">Selecione uma categoria</option>

      @for (category of categories(); track category.id) {
        <option [value]="category.id">{{ categoryLabel(category) }}</option>
      }
    </select>
  </app-form-field>

  <div class="budget-form__period">
    <app-form-field label="Mês" controlId="budget-month" [required]="true">
      <select appSelect id="budget-month" formControlName="month">
        @for (month of months; track $index) {
          <option [ngValue]="$index + 1">{{ month }}</option>
        }
      </select>
    </app-form-field>

    <app-form-field label="Ano" controlId="budget-year" [required]="true">
      <input appInput id="budget-year" type="number" min="1" max="9999" formControlName="year" />
    </app-form-field>
  </div>

  <app-form-field
    label="Limite mensal"
    controlId="budget-amount-limit"
    hint="Informe um valor maior que zero."
    [required]="true"
    [error]="fieldError('amountLimit')"
  >
    <input appInput appCurrencyInput id="budget-amount-limit" formControlName="amountLimit" />
  </app-form-field>

  <div class="budget-form__actions">
    <app-button
      type="button"
      variant="secondary"
      [disabled]="submitting()"
      (pressed)="cancelled.emit()"
    >
      Cancelar
    </app-button>

    <app-button type="submit" [loading]="submitting()" [disabled]="submitting()">
      {{ mode() === 'create' ? 'Criar orçamento' : 'Salvar alterações' }}
    </app-button>
  </div>
</form>
