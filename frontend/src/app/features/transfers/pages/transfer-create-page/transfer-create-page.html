<section class="page" aria-labelledby="transfer-create-title">
  <header class="page__header">
    <div>
      <h1 id="transfer-create-title">Nova transferência</h1>
      <p>Mova valores entre duas contas ativas.</p>
    </div>
  </header>

  @if (accountsState() === 'loading') {
    <div class="transfer-create-page__loading" aria-label="Carregando contas">
      <app-skeleton height="3rem" />
      <app-skeleton height="3rem" />
      <app-skeleton height="3rem" />
    </div>
  } @else if (accountsState() === 'error') {
    <app-error-state
      title="Não foi possível carregar as contas"
      message="Tente novamente em instantes."
      (retry)="loadAccounts()"
    />
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <fieldset class="transfer-create-page__fields" [disabled]="isProcessing()">
        <app-form-field
          label="Conta de origem"
          controlId="source-account"
          [required]="true"
          [error]="
            form.controls.sourceAccountId.touched && form.controls.sourceAccountId.invalid
              ? 'Selecione a conta de origem.'
              : undefined
          "
        >
          <select
            appSelect
            id="source-account"
            formControlName="sourceAccountId"
            (change)="onSourceAccountChange()"
          >
            <option value="">Selecione</option>

            @for (account of sourceAccounts(); track account.id) {
              <option [value]="account.id">{{ account.name }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field
          label="Conta de destino"
          controlId="destination-account"
          [required]="true"
          [error]="
            form.controls.destinationAccountId.touched && form.controls.destinationAccountId.invalid
              ? 'Selecione a conta de destino.'
              : undefined
          "
        >
          <select
            appSelect
            id="destination-account"
            formControlName="destinationAccountId"
            (change)="onDestinationAccountChange()"
          >
            <option value="">Selecione</option>

            @for (account of destinationAccounts(); track account.id) {
              <option [value]="account.id">{{ account.name }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field
          label="Valor"
          controlId="transfer-amount"
          [required]="true"
          [error]="
            form.controls.amount.touched && form.controls.amount.invalid
              ? 'Informe um valor maior que zero.'
              : undefined
          "
        >
          <input appInput appCurrencyInput id="transfer-amount" formControlName="amount" />
        </app-form-field>

        <app-form-field
          label="Data"
          controlId="transfer-date"
          [required]="true"
          [error]="
            form.controls.date.touched && form.controls.date.invalid
              ? 'Informe a data da transferência.'
              : undefined
          "
        >
          <input appInput id="transfer-date" type="date" formControlName="date" />
        </app-form-field>

        <app-form-field
          label="Descrição"
          controlId="transfer-description"
          [required]="true"
          [error]="
            form.controls.description.touched && form.controls.description.invalid
              ? 'Informe uma descrição de até 255 caracteres.'
              : undefined
          "
        >
          <input
            appInput
            id="transfer-description"
            type="text"
            maxlength="255"
            formControlName="description"
            autocomplete="off"
          />
        </app-form-field>

        @if (form.errors?.['sameAccount']) {
          <p class="transfer-create-page__error" role="alert">
            A conta de origem e a conta de destino devem ser diferentes.
          </p>
        }
      </fieldset>

      <div class="transfer-create-page__actions">
        <app-button
          type="button"
          variant="secondary"
          [disabled]="isProcessing()"
          (pressed)="goBack()"
        >
          Cancelar
        </app-button>

        <app-button type="submit" [loading]="isProcessing()" [disabled]="isProcessing()">
          Revisar transferência
        </app-button>
      </div>
    </form>
  }
</section>
