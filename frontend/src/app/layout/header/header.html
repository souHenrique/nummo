<header class="header">
  <a class="header__skip-link" href="#main-content" (click)="focusMainContent($event)">
    Pular para o conteúdo
  </a>

  <button
    class="header__menu-button"
    type="button"
    aria-label="Abrir ou fechar menu"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuToggle.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <a class="header__brand" routerLink="/dashboard">
    <span class="header__brand-logo" aria-hidden="true">
      <img src="logo-nummo.png" alt="" />
    </span>
    <span>Nummo</span>
  </a>

  <div class="header__actions">
    <button
      class="header__theme-toggle"
      type="button"
      [attr.aria-label]="
        themeService.theme() === 'light' ? 'Ativar tema escuro' : 'Ativar tema claro'
      "
      [attr.title]="themeService.theme() === 'light' ? 'Ativar tema escuro' : 'Ativar tema claro'"
      (click)="toggleTheme()"
    >
      <span aria-hidden="true">{{ themeService.theme() === 'light' ? '☀' : '☾' }}</span>
    </button>
    <a class="header__profile" routerLink="/profile">Perfil</a>

    <app-button class="header__logout" variant="secondary" size="sm" (pressed)="logout()">
      Sair
    </app-button>
  </div>
</header>
